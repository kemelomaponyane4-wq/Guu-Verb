name: Build Guu'Verb VST3
on: [push]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build
      - name: Build
        run: cmake --build build --config Release -j 4
      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: GuuVerb-VST3
          path: build/**/Guu'Verb.vst3
